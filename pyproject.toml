[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dhava"
version = "0.1.0"
description = "Offline-first data synchronization engine for Denied, Disrupted, Intermittent, and Limited bandwidth environments"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Vinkura AI", email = "founder@vinkura.in" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: System :: Networking",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "msgpack>=1.0.0",
    "zstandard>=0.21.0",
    "cryptography>=41.0.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/VinkuraAI/dhava"
Repository = "https://github.com/VinkuraAI/dhava"

[project.optional-dependencies]
serial = [
    "pyserial>=3.5",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
dhava = "cli:app"
ddil-sync = "cli:app"

[tool.hatch.build.targets.wheel]
packages = [
    "backends",
    "transports",
    "utils",
]
only-include = [
    "backends",
    "transports",
    "utils",
    "audit.py",
    "cli.py",
    "conflict.py",
    "crypto.py",
    "engine.py",
    "models.py",
    "protocol.py",
    "outbox.py",
    "server.py",
    "store.py",
    "transport.py",
    "vector_clock.py",
    "__init__.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
